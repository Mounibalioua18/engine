.combo-btn:hover{border-color:var(--accent);color:var(--text)}

.pill.UDP{background:rgba(255,184,48,.2);color:var(--udp);border:1px solid rgba(255,184,48,.4)}

'P1.java':`import java.rmi.*;
import java.rmi.registry.*;
import java.rmi.server.*;
import java.util.Scanner;

public class P1 extends UnicastRemoteObject implements InterfaceP1 {

    public P1() throws RemoteException {}

    // ← P2 appelle cette méthode pour renvoyer le résultat
    @Override
    public void reception(int S) throws RemoteException {
        System.out.println("P1 reçu résultat S = " + S);
    }

    public static void main(String[] args) {
        try {
            // ── Serveur RMI de P1 (pour que P2 puisse appeler P1) ──
            P1 obj = new P1();
            Registry reg1 = LocateRegistry.createRegistry(1097);
            reg1.rebind("referenceP1", obj);
            System.out.println("Serveur RMI P1 prêt (port 1097)");

            // ── Lecture de N ──
            Scanner sc = new Scanner(System.in);
            System.out.print("Donner N : ");
            int N = sc.nextInt();

            // ── Envoi RMI vers P2 ──
            Registry reg2 = LocateRegistry.getRegistry("localhost", 1096);
            InterfaceP2 p2 = (InterfaceP2) reg2.lookup("referenceP2");
            p2.reception(N);
            System.out.println("P1 a envoyé N=" + N + " à P2 via RMI");

        } catch (Exception e) {
            System.err.println("Erreur P1 : " + e.getMessage());
            e.printStackTrace();
        }
    }
}`,

'P2.java':`import java.rmi.*;
import java.rmi.registry.*;
import java.rmi.server.*;

public class P2 extends UnicastRemoteObject implements InterfaceP2 {

    public P2() throws RemoteException {}

    // ← P1 appelle cette méthode
    @Override
    public void reception(int N) throws RemoteException {
        System.out.println("P2 reçu N = " + N);
        int S = N * 2;
        System.out.println("P2 calcule S = " + S);

        // ── Retour RMI vers P1 ──
        try {
            Registry reg = LocateRegistry.getRegistry("localhost", 1097);
            InterfaceP1 p1 = (InterfaceP1) reg.lookup("referenceP1");
            p1.reception(S);
            System.out.println("P2 a renvoyé S=" + S + " à P1 via RMI");
        } catch (Exception e) {
            System.err.println("Erreur retour P2→P1 : " + e.getMessage());
        }
    }

    public static void main(String[] args) {
        try {

            Registry registry = LocateRegistry.createRegistry(1096);
            registry.rebind("referenceP2", obj);
            System.out.println("Serveur RMI P2 prêt (port 1096)");

            System.err.println("Erreur P2 : " + e.getMessage());
            e.printStackTrace();
        }
    }
}`,

'P1.java':`import java.io.*;
import java.net.*;
import java.util.Scanner;

public class P1 {

    public static void main(String[] args) {
        try {
            // ── Serveur TCP de P1 : écoute le retour de P2 ──
            ServerSocket serverSocket = new ServerSocket(2001);
            new Thread(() -> {
                try {
                    System.out.println("P1 écoute TCP port 2001 (retour de P2)...");
                    Socket s = serverSocket.accept();
                    ObjectInputStream in = new ObjectInputStream(s.getInputStream());
                    int S = Integer.parseInt((String) in.readObject());
                    System.out.println("P1 reçu résultat S = " + S);
                    in.close(); s.close();
                } catch (Exception e) { e.printStackTrace(); }
            }).start();

            // ── Envoi TCP vers P2 ──
            Scanner sc = new Scanner(System.in);
            System.out.print("Donner N : ");
            int N = sc.nextInt();

            Socket socket = new Socket("localhost", 2002);
            ObjectOutputStream out = new ObjectOutputStream(socket.getOutputStream());
            out.writeObject(Integer.toString(N));
            out.close(); socket.close();
            System.out.println("P1 a envoyé N=" + N + " à P2 via TCP");

        } catch (Exception e) {
            System.err.println("Erreur P1 : " + e.getMessage());
            e.printStackTrace();
        }
    }
}`,

public class P2 {

    public static void main(String[] args) {
        try {
            // ── Serveur TCP de P2 : écoute P1 ──

            while (true) {
                Socket socket = serverSocket.accept();
                ObjectInputStream in = new ObjectInputStream(socket.getInputStream());
                int N = Integer.parseInt((String) in.readObject());

                in.close(); socket.close();

                out.writeObject(Integer.toString(S));
                out.close(); retSocket.close();
                System.out.println("P2 a renvoyé S=" + S + " à P1 via TCP");
            }

        } catch (Exception e) {
            System.err.println("Erreur P2 : " + e.getMessage());
            e.printStackTrace();
        }
    }
}`,

'P1.java':`import java.net.*;
import java.util.Scanner;

public class P1 {

    public static void main(String[] args) {
        try {
            // ── Serveur UDP de P1 : écoute le retour de P2 ──
            DatagramSocket udpServer = new DatagramSocket(2011);
            new Thread(() -> {
                try {
                    System.out.println("P1 écoute UDP port 2011 (retour de P2)...");
                    byte[] buf = new byte[1024];
                    DatagramPacket pkt = new DatagramPacket(buf, buf.length);
                    udpServer.receive(pkt);
                    int S = Integer.parseInt(new String(pkt.getData(), 0, pkt.getLength()).trim());
                    System.out.println("P1 reçu résultat S = " + S);
                } catch (Exception e) { e.printStackTrace(); }
            }).start();

            // ── Envoi UDP vers P2 ──

            System.out.print("Donner N : ");
            int N = sc.nextInt();

            DatagramSocket ds = new DatagramSocket();
            byte[] data = Integer.toString(N).getBytes();
            InetAddress addr = InetAddress.getByName("localhost");
            ds.send(new DatagramPacket(data, data.length, addr, 2012));
            ds.close();
            System.out.println("P1 a envoyé N=" + N + " à P2 via UDP");

        } catch (Exception e) {
            System.err.println("Erreur P1 : " + e.getMessage());
            e.printStackTrace();
        }
    }
}`,

//  UI
// ══════════════════════════════════════════════════════════════
let currentCombo = 'RMI_RMI';
let currentFile  = 'P1.java';

const COLORS = {TCP:'var(--tcp)',UDP:'var(--udp)',RMI:'var(--rmi)'};
const ORDER  = {
  RMI:'Démarrer P2 (RMI server) puis P1',
  TCP:'Démarrer P2 (TCP server) puis P1',
  UDP:'Démarrer P2 (UDP server) puis P1',
};

function buildComboBar() {
  const bar = document.getElementById('combo-bar');
  bar.innerHTML = '';
  COMBOS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'combo-btn' + (c.id === currentCombo ? ' active' : '');
    btn.innerHTML =
      \`<span class="pill \${c.send}">\${c.send}</span>
       <span style="color:var(--muted);font-size:10px">→ ret →</span>
       <span class="pill \${c.ret}">\${c.ret}</span>\`;
    btn.onclick = () => { currentCombo = c.id; currentFile = 'P1.java'; render(); };
    bar.appendChild(btn);
  });
}

function buildDiagram(send, ret) {
  const d = document.getElementById('diagram');
  d.innerHTML = \`
    <div class="proc-box">P1</div>
    <div class="arrow-wrap">
      <div class="arrow-line" style="color:\${COLORS[send]}">
        <span class="pill \${send}">\${send}</span>
        <span class="arrow-sym">→</span>
      </div>
      <div class="arrow-line" style="color:\${COLORS[ret]}">
        <span class="arrow-sym">←</span>
        <span class="pill \${ret}">\${ret}</span>
      </div>
    </div>
    <div class="proc-box">P2</div>
  \`;
}

function buildFileTabs() {
  const ft  = document.getElementById('file-tabs');
  const cpb = document.getElementById('copy-btn');
  ft.innerHTML = '';
  ft.appendChild(cpb);
  const files = FILES[currentCombo];
  Object.keys(files).forEach(f => {
    const btn = document.createElement('button');
    const isIface = f.startsWith('Interface');
    btn.className = 'file-tab' + (f === currentFile ? (isIface ? ' ai' : ' ap') : '');
    btn.textContent = f;
    btn.onclick = () => { currentFile = f; buildFileTabs(); showCode(); };
    ft.insertBefore(btn, cpb);
  });
}

function showCode() {
  document.getElementById('code-out').textContent =
    FILES[currentCombo][currentFile] || '// Fichier non disponible';
}

function copyActive() {
  const text = FILES[currentCombo][currentFile] || '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    const orig = btn.textContent;
    btn.textContent = '✓ Copié !'; btn.className = 'copy-btn ok';
    setTimeout(() => { btn.textContent = orig; btn.className = 'copy-btn'; }, 1500);
  });
}

function render() {
  const c = COMBOS.find(x => x.id === currentCombo);
  buildComboBar();
  buildDiagram(c.send, c.ret);
  if (!FILES[currentCombo][currentFile]) currentFile = 'P1.java';
  buildFileTabs();
  showCode();
}

render();
